# Create with: micromamba env create -f conda_environment.yml --channel-priority flexible
# torch is pinned to 2.5.1 (CUDA 12.4): torchaudio >= 2.9 removed torchaudio.info, used by
# the data preparation and by torch-audiomentations.
name: insects
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.12
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision=0.20.1
  - pytorch::torchaudio=2.5.1
  - pytorch::pytorch-cuda=12.4
  - numpy<2
  - ffmpeg<7
  - torchinfo
  - scipy
  - pandas
  - scikit-learn
  - seaborn
  - matplotlib
  - pip
  - tqdm
  - openpyxl
  - wandb
  - timm
  - librosa
  - coloredlogs
  - upsetplot
  - more-itertools
  - rapidfuzz
  - psutil
  - python-dotenv
  - pympler
  - plotly
  - pip:
    - torchlibrosa
    - torch-audiomentations==0.12.0
    - python-stretch
